[project]
name = "blaze-worker"
version = "0.1.0"
description = "Analysis workers for Blaze Gallery: a Postgres job queue shared by several machines, and the face task"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40",
  "hsemotion-onnx>=0.3.1",
  "insightface>=2.1",
  "numpy>=2.0",
  "onnxruntime>=1.22",
  "opencv-python-headless>=4.10",
  "pgvector>=0.4",
  "pillow>=11",
  "pillow-heif>=1.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "rawpy>=0.24",
]

[project.scripts]
blaze-worker = "blaze_worker.cli:run_worker"
blaze-enqueue = "blaze_worker.cli:run_enqueue"
blaze-queue = "blaze_worker.cli:run_status"
blaze-faces-preview = "blaze_worker.cli:run_preview"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "testcontainers>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blaze_worker"]

[tool.uv]
# insightface requires opencv-python, the build linked against Qt/libGL that
# a headless container lacks; both ship the same cv2 module. Keep only the
# headless one.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
